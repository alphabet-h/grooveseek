[package]
name = "groove-tray"
version = "1.1.0"
edition = "2024"
description = "Windows system tray monitor for groove daemon (Phase 2 of F-6/H-9)"
authors = ["koshian"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/alphabet-h/grooveseek"
homepage = "https://github.com/alphabet-h/grooveseek"
# NOTE (codex P2 round 3 on PR #61): `publish = false` の internal crate なので
# readme field は不要。crates/groove-tray/README.md は存在せず metadata
# validation が fail するため削除。
publish = false

# cargo-dist per-crate target gating: groove-tray.exe is Windows-only, so we
# narrow the dist matrix to a single target. The main `groove` crate inherits
# the workspace-wide target list (= 4 targets) from dist-workspace.toml.
[package.metadata.dist]
dist = true
targets = ["x86_64-pc-windows-msvc"]

[[bin]]
name = "groove-tray"
path = "src/main.rs"

[lib]
name = "groove_tray"
path = "src/lib.rs"

# rustdoc lint levels come from the workspace root, where the reasoning lives.
[lints]
workspace = true

# Windows-only runtime dependencies. The non-Windows build path is a fail-fast
# stub (see src/main.rs) so these deps are not compiled on Linux/macOS.
[target.'cfg(windows)'.dependencies]
tray-icon = "0.24"
tao = "0.35"
image = "0.25"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "process"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
# Stopping the daemon goes through OpenProcess / QueryFullProcessImageNameW /
# TerminateProcess (see src/process.rs). Opening the web UI goes through
# ShellExecuteW (see src/ui.rs) — AU-12 replaced `cmd /c start`, which parsed
# the URL as a command line. Already in the tree transitively via
# tao/tray-icon; declared directly because we call it ourselves.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# NOTE (codex P1 round 1 on PR #61): keep `winresource` as an unconditional
# build-dep. Restricting it to `[target.'cfg(windows)'.build-dependencies]`
# breaks `cargo check/test --workspace` on Linux/macOS because Rust still
# compiles build.rs and resolves the `winresource::WindowsResource` path
# before the runtime CARGO_CFG_TARGET_OS branch can skip it. The crate is
# usable on all hosts (it generates Windows resources via cross-compilation).
[build-dependencies]
winresource = "0.1"
