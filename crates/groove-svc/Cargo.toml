[package]
name = "groove-svc"
version = "1.24.0"
edition = "2024"
description = "Windows hidden-console launcher for groove.exe serve"
authors = ["koshian"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/alphabet-h/grooveseek"
homepage = "https://github.com/alphabet-h/grooveseek"
# Internal crate (= used only as a child binary in the Windows Task Scheduler
# Action). publish = false avoids the crates.io readme/metadata validation.
publish = false

# cargo-dist per-crate target gating: groove-svc.exe is Windows-only because its
# entire purpose is to side-step Windows' console subsystem allocation. The
# Linux / macOS build path is a fail-fast stub (`fn main()` exits 1) so the
# crate compiles cleanly on all hosts but only ships in the Windows zip.
[package.metadata.dist]
dist = true
targets = ["x86_64-pc-windows-msvc"]

[[bin]]
name = "groove-svc"
path = "src/main.rs"

# (kuriya #650) The record of the server it starts, beside the service's
# groove.toml, with the child's creation time read from its handle. On every
# target, not only Windows: the record type compiles everywhere (serde only),
# and the crate's docs link it on the Linux / macOS CI legs too.
[dependencies]
groove-winproc = { path = "../groove-winproc" }

# rustdoc lint levels come from the workspace root, where the reasoning lives.
[lints]
workspace = true
