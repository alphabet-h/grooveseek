name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # 既定は 360 分 = ハングした job が runner を 6 時間占有する。直近 40 run の
    # 実測 worst case は windows の 6.5 分なので、cold cache (rust-cache miss +
    # BGE-small ~130 MB の DL) を見込んでも 30 分あれば余裕がある。
    timeout-minutes: 30
    env:
      # Force a uniform, cacheable model-cache path on all 3 OSes
      # (resolve_cache_dir honors FASTEMBED_CACHE_DIR first).
      FASTEMBED_CACHE_DIR: ${{ github.workspace }}/.fastembed_cache
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # key に Cargo.lock のハッシュを含めるのは、`actions/cache` が
      # **既存 key を上書き保存しない**ため (実機ログ: `Cache hit occurred on
      # the primary key ..., not saving cache.`)。key が content 非依存だと、
      # 一度保存された archive が以後ずっと復元され続け、fastembed / ort を
      # bump してモデルの版が変わっても古い tree が居座る。job は green の
      # まま古いモデルで検査することになるので、Cargo.lock を混ぜて自然に
      # 回転させる。`-v1-` は、中身の構成を変えた時に手で回すための版数。
      #
      # prefix は nightly.yml (`fastembed-v4-...`) と **意図的に分けてある**。
      # nightly は BGE-M3 と reranker を含む ~2.7 GB を保存するので、同じ key に
      # すると先に終わった側が key を取った時点でもう一方は保存できなくなる
      # (nightly.yml の coverage job のコメント参照)。
      #
      # `restore-keys` は **意図的に付けない**。prefix fallback を許すと、部分
      # hit した run が古い中身をそのまま新しい key で保存し直すため、上で
      # 入れた回転が骨抜きになる。ここで要るのは BGE-small (~130 MB) だけで、
      # miss した日に素直に DL させても割に合う。nightly が restore-keys を
      # 持つのは 2.7 GB の再取得が現実的でないからで、事情が違う。
      - name: Cache embedding models (fastembed)
        uses: actions/cache@v5
        with:
          path: .fastembed_cache
          key: fastembed-bge-small-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: cargo check
        run: cargo check --all-targets
      - name: Pre-warm embedding model cache (serial)
        # index_progress_cli spawns groove subprocesses that each need the
        # BGE-small model. On a cold cache, running them in parallel makes
        # the subprocesses race on the HuggingFace hub download lock
        # (observed: "Lock acquisition failed" flake). Run this target
        # single-threaded first so exactly one process downloads the model;
        # the full suite below then runs against a warm cache.
        run: cargo test --test index_progress_cli -- --test-threads=1
      - name: cargo test (non-ignored only; ignored tests download ONNX models)
        run: cargo test

      # doc rot, on the same 3 OSes and for ~16 seconds.
      #
      # A step in this job rather than a fourth job: `cargo doc --no-deps` wants
      # exactly the dependency metadata `cargo check --all-targets` produced
      # above, so here it costs one rustdoc pass (measured locally: 15.8 s over
      # the whole workspace with a warm dependency tree) instead of a second
      # dependency build. A separate job would also add three `rust-cache`
      # entries to a repository whose Actions cache is already 13.6 GB across 23
      # entries against a 10 GB limit (measured 2026-08-23), so entries are being
      # evicted and the new job's cost would land on the other jobs' cold runs.
      #
      # The matrix is the point. `service/{linux,macos,windows}.rs` are whole
      # modules behind `#[cfg(target_os = ...)]` and `links.rs` gates function
      # bodies the same way, so exactly one branch of each is documented per
      # runner: a single-OS doc check leaves the other two unread.
      #
      # `!cancelled()` rather than the default: run this even when the test step
      # above failed, so one run reports both. Ordered last for the same reason
      # in the other direction -- a stale doc reference must not withhold the
      # test results this job exists to produce.
      #
      # `--document-private-items` is what makes it a guard rather than a
      # formality: most of this crate is private modules, and six dead names
      # (`GraphNode`, `inspect`, `is_multiply_linked` x2, `read_checked` x2)
      # sat in `//!` docs that the public-only walk never read. Levels come from
      # `[workspace.lints.rustdoc]` in the root Cargo.toml, where the reasoning
      # is; nothing here sets them, so a local `cargo doc` says the same thing.
      - name: cargo doc (doc comments may not name what the tree lacks)
        if: ${{ !cancelled() }}
        run: cargo doc --no-deps --workspace --document-private-items

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # 実測 worst case は windows の 3.3 分。cold compile を見込んで 20 分。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      # Nothing else in CI ever enables these features, so everything behind
      # them — `KbServerShared::for_test`, the admin-endpoint tests in
      # tests/webui_integration.rs, the reranker benches — was never compiled
      # by any job and could rot unnoticed. Measured: breaking the gated module
      # leaves the run above green and fails this one.
      #
      # Both runs are needed. The one above is the only thing covering the
      # `#[cfg(not(feature = "heavy-bench"))]` branches in benches/, which this
      # one compiles out. Enabling `heavy-bench` only compiles the reranker
      # benches; running them (a ~2.3 GB download) still takes `cargo bench`.
      - run: cargo clippy --all-targets --features test-helpers,heavy-bench -- -D warnings

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    # 実測 0.2 分。toolchain の導入がほぼ全てなので 10 分で十分。
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
