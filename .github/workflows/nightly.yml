name: Nightly

# 毎日 UTC 04:00 (≒ JST 13:00) に走らせる「重めの自動チェック」。
# - cargo test -- --include-ignored: 通常 CI では skip している embedder /
#   reranker 系の実 DL を伴う test (`#[ignore]` 付き、2026-07-26 時点で 40 本)
#   を一通り走らせる。**ubuntu と windows の 2 leg** で回す: Windows 固有の
#   service (Task Scheduler) / tray (.lnk) テストは `#[ignore]` 側にしか無く、
#   Linux だけを回していると永久に検証されないため (AU-09)。
#   モデルは actions/cache で挟むので、2 回目以降は HuggingFace からの再 DL は
#   不要 (BGE-small ~130 MB / BGE-M3 ~2.3 GB / BGE-reranker ~2.3 GB)。
# - cargo test --bench: criterion の test mode で bench を 1 回ずつ実行する
#   (BU-25)。**計測ではなく生存確認**で、compile が通るだけの bench が
#   「何も測っていない」状態に腐るのを止めるのが目的 (詳細は当該 step の注)。
# - cargo audit: 依存ツリーを RustSec advisory DB と突合。新しい advisory
#   が出た時に nightly が fail することで notification として機能する。
#
# workflow_dispatch も付けてあるので、依存 bump 後やリリース前に手動トリガ
# 可能。`gh workflow run nightly.yml` で起動できる。
#
# F-38 (2026-04-29 audit) で導入。eval regression detection は groove eval
# 側に --fail-on-regression flag を入れる別 PR で追加予定。

on:
  schedule:
    # cron は UTC。'0 4 * * *' = 毎日 UTC 04:00。
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      notify:
        description: >-
          Open/close the tracking issue as if this were the scheduled run.
          Off by default so branch experiments stay quiet; the only way to
          exercise the reporting path end to end.
        type: boolean
        default: false

# 同一 ref で同時実行を抑制 (手動 + schedule が重なった場合の保険)。
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  ignored-tests:
    name: ignored tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 片方の OS が落ちても、もう片方の結果は最後まで見たい。
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            # Linux leg は全部走らせる (巨大モデルを要求するものを含む)。
            skip_args: ''
            # resolve_cache_dir() の fallback #2 (dirs::cache_dir()) の実体。
            # なぜこれも cache するかは下の "Cache fastembed models" 参照。
            default_model_dir: ~/.cache/fastembed
          - os: windows-latest
            # Windows leg は「巨大モデルを要求するもの」だけ除外する。
            # **下の一覧がそのまま定義で、件数は書かない** — 数詞は一覧と別に
            # 腐る (L-11 で同じ形を直した)。`skip_args` と 1 対 1 で対応する:
            #   - test_bge_m3_produces_1024_dim       (BGE-M3 ~2.3 GB)
            #   - test_bge_reranker_v2_m3_reorders_ja (reranker ~2.3 GB)
            #   - kb_eval_retrieval_quality_bge_m3    (BGE-M3 ~2.3 GB、BU-11)
            #   - groove_search_reads_rerank_by_default_from_the_config_file
            #                                         (reranker ~2.3 GB、L-25)
            # 理由:
            #   (a) windows-latest の空きディスクは公称 14 GB しかなく、
            #       4.6 GB のモデル展開はビルド領域を圧迫する
            #   (b) Actions cache は repo あたり 10 GB 上限の LRU。Linux leg の
            #       model cache だけで ~2.6 GB あり、同じものを Windows 側にも
            #       積むと PR CI 用の cache まで押し出してしまう
            # 除外しているものはいずれも埋め込み次元・rerank 並び替え・
            # retrieval 品質・設定の配線を見る **OS 非依存** の検査で、
            # Linux leg が同一の assert を通している。
            # ONNX を Windows 上で実行する経路自体は BGE-small を使う他テストが
            # 踏むため、除外しても Windows 固有の死角は生まれない — BU-11 の
            # 品質ゲートも BGE-small 版 (kb_eval_retrieval_quality_bge_small)
            # が両 OS で走る。
            skip_args: '--skip test_bge_m3_produces_1024_dim --skip test_bge_reranker_v2_m3_reorders_ja --skip kb_eval_retrieval_quality_bge_m3 --skip groove_search_reads_rerank_by_default_from_the_config_file'
            default_model_dir: ~/AppData/Local/fastembed
    # 初回は 5 GB 弱の DL があり得るので thoroughly 余裕を持つ。
    timeout-minutes: 60
    env:
      # モデル cache 先を OS 共通の相対パスに固定する。resolve_cache_dir は
      # FASTEMBED_CACHE_DIR を最優先で見る (src/embedder.rs) ので、これで
      # Linux の ~/.cache/fastembed と Windows の %LOCALAPPDATA%\fastembed の
      # 差を吸収でき、actions/cache の `path` を 1 つに保てる。ci.yml が既に
      # 同じ方式を採っている。
      FASTEMBED_CACHE_DIR: ${{ github.workspace }}/.fastembed_cache
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Cargo.lock のハッシュを key に含めると ort/fastembed の major bump 時に
      # cache が自然に invalidate される。
      #
      # `FASTEMBED_CACHE_DIR` が効くので、モデルは基本的に `.fastembed_cache` に
      # 落ちる。OS 既定ディレクトリも併せて cache するのは保険:
      # `resolve_cache_dir()` は env が無ければ `dirs::cache_dir()` に落ちるため、
      # env を継承しない経路が 1 つでもあると、そこだけ cache 対象外になる。
      #   - `.fastembed_cache`     … env が効いている全プロセス
      #   - `<default_model_dir>`  … env を見ずに解決した場合の落ち先
      # かつて lib test が `remove_var("FASTEMBED_CACHE_DIR")` でプロセス全体の
      # env を消しており、実際に BGE-M3 / reranker がここへ逸れていた。その
      # 根本原因は AU-63 で解消済みだが、同種の再発を黙って劣化させないために
      # 両方を cache し続ける (片方だけだと job は green のまま毎晩 4.6 GB を
      # 再 DL する。2026-07-26 に Linux cache が 2.6 GB → 74 MB に縮んで発覚)。
      #
      # key の版数は **path・中身の構成・モデルの落ち先が変わったら必ず上げる**:
      # (a) 旧 `fastembed-<os>-<hash>` の tar は `~/.cache/fastembed` を絶対
      #     パスで抱えており、`path` だけ変えて同じ key を再利用すると
      #     「cache hit したのに参照先には何も無い」状態が永続する
      # (b) `actions/cache` は **既存 key を上書き保存しない**。実機ログでも
      #     `Cache hit occurred on the primary key ..., not saving cache.` と
      #     出る。したがって key を据え置くと、古い配置の archive が
      #     Cargo.lock が変わるまで凍結される
      # `-v4-` は (b) が理由: AU-63 で env が消えなくなり、モデルの落ち先が
      # `.fastembed_cache` に一本化されたので、v3 の archive (= 大物が
      # `<default_model_dir>` 側に入っている) を作り直す必要がある。
      - name: Cache fastembed models
        uses: actions/cache@v5
        with:
          path: |
            .fastembed_cache
            ${{ matrix.default_model_dir }}
          key: fastembed-v4-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            fastembed-v4-${{ runner.os }}-

      # cold cache のとき、複数の integration test binary が **別プロセス** と
      # して同時に groove を spawn し、HuggingFace hub の同一 blob lock を
      # 奪い合って "Lock acquisition failed" で落ちる。ci.yml には PR #71 で
      # 同じ pre-warm が入ったが nightly には無く、model cache が 10 GB LRU で
      # 追い出された夜に顕在化する (2026-07-26 の dry-run で ubuntu / windows
      # 双方とも再現)。1 プロセスだけに DL させてから本体を warm cache で回す。
      #
      # BGE-M3 / reranker は lib test binary の中 (= 単一プロセス、別 blob) から
      # しか触られないので、ここで温めるのは BGE-small だけでよい。
      #
      # retry する理由: 上流 (HuggingFace CDN) の一時障害で nightly が赤くなるのを
      # 防ぐため。2026-07-26 の実測では cold cache の run を短時間に繰り返したところ
      # model.onnx の取得が 503 を返した (run 30190347439)。厄介なのは、失敗すると
      # 罠 3 (= cache は job 成功時のみ保存) により翌日も cold のままで、
      # **自然回復しない**こと。
      #
      # 本 step の目的は cache を温めることで、その合否は品質シグナルではない
      # (本体スイートは後段で別に走る)。したがってここでの retry は flaky test の
      # 隠蔽にはあたらない。
      - name: Pre-warm embedding model cache (serial)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if cargo test --test index_progress_cli -- --test-threads=1; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              backoff=$((attempt * 60))
              echo "::warning::pre-warm attempt ${attempt} failed; retrying in ${backoff}s" >&2
              sleep "${backoff}"
            fi
          done
          echo "::error::pre-warm failed after 3 attempts" >&2
          exit 1

      - name: cargo test -- --include-ignored
        # `--include-ignored` は ignored + 通常両方を走らせる。nightly では
        # 通常の `cargo test` も合わせて走らせて、ignored だけ落ちる
        # (model DL だけ壊れている) ケースを切り分けやすくする。
        #
        # `--features test-helpers` はここでしか効かない。gate の向こうにある
        # admin endpoint テスト 2 本は `#[ignore]` でもあるので、PR CI が
        # feature 付きで compile しても**走らない** — 実行まで届くのは
        # `--include-ignored` を渡すこの job だけ。
        run: cargo test --features test-helpers -- --include-ignored ${{ matrix.skip_args }}

      # BU-25: the benches under `benches/` were compiled by every PR
      # (`cargo clippy --all-targets`, twice, so the `heavy-bench` halves are
      # covered too) but had never been **executed** by CI. Compiling is the
      # weaker check: AU-56 found `search_latency` timing an unindexed fixture,
      # where every iteration measured the cost of starting the binary and
      # finding nothing — it built cleanly and produced graphs the whole time.
      #
      # criterion's test mode (cargo passes `--test` to a `harness = false`
      # bench target) runs each benchmark body **once** and reports pass/fail
      # without measuring. That is deliberate: this step is a **liveness check,
      # not a performance gate**. Wall-clock on a shared runner is too noisy to
      # threshold at any sample size we can afford, and criterion exits 0 even
      # when `--baseline` reports a regression, so gating would need an external
      # script over `target/criterion/**/estimates.json` (out of scope here).
      # Thresholded performance guards live in the test suite instead — e.g.
      # `bu03_or_expansion_stays_within_a_small_multiple_of_a_single_phrase`,
      # which runs in the step above and bounds feature-48's FTS cost.
      #
      # `--features test-helpers` matches the step above so the bench targets
      # link against artefacts that are already built; a different feature set
      # would rebuild the lib and the binary from scratch.
      #
      # The targets are named one by one rather than with `--benches`, which
      # would also re-run every unit test (lib and bin targets default to
      # `bench = true`). `tests/bench_targets_run_in_ci.rs` fails if the two
      # lists drift apart, in either direction.
      #
      # `heavy-bench` stays off: running those bodies needs the ~2.3 GB reranker
      # that the Windows leg deliberately does not download (see `skip_args`).
      - name: cargo test --bench (criterion test mode, no measurement)
        run: >
          cargo test --features test-helpers
          --bench index_throughput
          --bench mmr_perf
          --bench search_latency
          --bench string_ops

  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      # advisory にぶつかれば exit 1 で job fail = notification として機能する。
      # 既知 advisory を一時的に許容したい場合は --ignore RUSTSEC-... を渡す。
      - name: cargo audit
        run: cargo audit

  coverage:
    name: line coverage (cargo-llvm-cov)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8

      # 本 job は cache も pre-warm も持たず、毎回 cold から複数 test binary が
      # 並列にモデルを DL していたため、ignored-tests job と同じ blob lock 競合で
      # 断続的に落ちていた (2026-07-26 の dry-run run 30190003925 で再現)。
      #
      # **restore 専用** にしてあるのが要点: save も行うと ignored-tests job と
      # 同じ key を奪い合い、先に終わった本 job (BGE-small だけ ≒ 74 MB) が
      # key を取ってしまうと、ignored-tests 側の 2.7 GB は
      # 「既存 key は上書きしない」規則で永久に保存されなくなる。
      # 本 job は非 ignored テストしか走らせず BGE-small しか要らないので、
      # ignored-tests job が保存した cache に相乗りするだけでよい。
      - name: Restore fastembed models (shared with ignored-tests)
        uses: actions/cache/restore@v5
        with:
          path: |
            .fastembed_cache
            ~/.cache/fastembed
          key: fastembed-v4-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            fastembed-v4-${{ runner.os }}-

      # cache miss の日でも lock 競合で落ちないよう、1 プロセスで先に温める。
      # retry の理由は ignored-tests job 側の同名 step のコメントを参照。
      - name: Pre-warm embedding model cache (serial)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if cargo test --test index_progress_cli -- --test-threads=1; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              backoff=$((attempt * 60))
              echo "::warning::pre-warm attempt ${attempt} failed; retrying in ${backoff}s" >&2
              sleep "${backoff}"
            fi
          done
          echo "::error::pre-warm failed after 3 attempts" >&2
          exit 1

      # `cargo test` の non-ignored セット (= unit + integration test、
      # `#[ignore]` 除外) で coverage を取る (~5-10 min)。
      # `--include-ignored` (model DL ~5 GB) は別 job (= ignored-tests)
      # で実行済なので、本 job は coverage 数値の baseline 観測が目的。
      # `--summary-only` で per-region detail を抑制し、file 単位 summary
      # table + TOTAL 行のみ出力 (= F-59 「死角を定量化」要件)。
      # `--color never` で ANSI escape を抑制し GITHUB_STEP_SUMMARY の
      # code block 整合性を保つ。
      - name: Run coverage (non-ignored only)
        # `--no-report` stops here with the profile data on disk; the two
        # `report` invocations below re-render it without re-running anything,
        # so the human-readable table and the threshold below share one test run.
        run: cargo llvm-cov --no-report

      - name: Render the coverage summary
        run: cargo llvm-cov report --summary-only --color never > coverage_summary.txt

      # `if: always()` matters now that a later step can fail the job: the run
      # where the floor trips is exactly the run where you want the table
      # (BU-26). This step still comes *before* the gate, so the ordering alone
      # would suffice — the condition is here so that reordering cannot
      # silently take the table away again.
      - name: Append summary to GITHUB_STEP_SUMMARY
        if: always()
        run: |
          {
            echo "## Line coverage (cargo-llvm-cov, non-ignored tests)"
            echo ""
            echo '```'
            cat coverage_summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 通常 log (= workflow run の Raw logs / `gh run view --log`
          # で参照可) にも summary を直接出力。HEREDOC 内の `cat` は
          # GITHUB_STEP_SUMMARY への redirection 専用なので stdout に
          # 何も出ない、ここで bare `cat` により通常 log でも summary を
          # grep 可能にする。
          cat coverage_summary.txt

      # BU-26: until now the number was only *observed*. A module could arrive
      # with no tests at all and nothing would say so — the TOTAL barely moves.
      #
      # The floor is **per file** (`--fail-under-file-lines`, = fail if any one
      # file is below it), deliberately not the global `--fail-under-lines`.
      # The TOTAL here is not a quantity you can threshold honestly:
      #   - 53.8% of the physical lines under grooveseek/src are in-file
      #     `#[cfg(test)] mod tests`, which is ~100% covered by construction and
      #     pulls the number *up*;
      #   - code reachable only from `#[ignore]` tests reads as 0% in this job,
      #     which pulls it *down* (see the exclusions below);
      #   - ~3,400 lines of Windows/macOS-only code are not in this leg's
      #     denominator at all.
      # A global threshold is also satisfiable by adding tests to a module that
      # already has plenty, which is not the failure being guarded against.
      #
      # 35 is a tripwire for "arrived with no tests", not a quality target. The
      # measured distribution on 2026-08-14 was 0.00 / 0.00 / 0.00 (the three
      # excluded files), then main.rs 41.43, embedder.rs 58.90, server.rs 63.16,
      # watcher.rs 65.57, and everything else ≥ 78. Raising the floor past ~40
      # means either excluding main.rs as well or living without headroom.
      #
      # The exclusions are structural, not convenience: each is invisible to a
      # non-ignored test run rather than untested.
      #   - transport/stdio.rs   — the stdio transport is driven by subprocess
      #                            tests that are all `#[ignore]`
      #   - service/linux.rs     — the systemd backend is exercised only by
      #                            `#[ignore]` tests that touch the real user
      #                            session
      #   - groove-tray/main.rs  — a 3-line Windows GUI entry point
      # `report` reuses the data collected above, so this costs seconds.
      - name: Enforce a per-file line-coverage floor
        shell: bash
        run: |
          set -euo pipefail
          FLOOR=35
          # Forward slashes: llvm-cov matches the regex against the path as the
          # coverage data records it, which on this runner is POSIX. The same
          # command run on Windows matches nothing (the separators are
          # backslashes there) and reports the excluded files too.
          IGNORE='(grooveseek/src/transport/stdio\.rs|grooveseek/src/service/linux\.rs|crates/groove-tray/src/main\.rs)$'
          # cargo-llvm-cov exits 1 without naming the file that tripped the
          # floor, so name it here — a nightly failure has to be diagnosable
          # from the log without re-running a coverage build locally.
          #
          # `<=`, not `<`: the flag requires every file to be *strictly above*
          # MIN. Measured — `--fail-under-file-lines 0` exits 1 while a file
          # sits at exactly 0.00%, and 28 passes against a file at 28.06% while
          # 29 fails. The two conditions have to agree, or the run that fails is
          # the one with no annotation.
          cargo llvm-cov report --json --summary-only \
            --ignore-filename-regex "$IGNORE" > coverage.json
          jq -r --argjson floor "$FLOOR" '
            .data[0].files[]
            | select(.summary.lines.percent <= $floor)
            | "::error::\(.filename): line coverage \(.summary.lines.percent * 100 | floor / 100)% is below the \($floor)% floor"
          ' coverage.json
          cargo llvm-cov report --summary-only --color never \
            --fail-under-file-lines "$FLOOR" --ignore-filename-regex "$IGNORE"

  # ---------------------------------------------------------------------------
  # 失敗を「気付ける場所」に置く。
  #
  # 公式仕様では scheduled workflow の失敗は **workflow を作った人 (= cron を
  # 最後に触った人)** に通知される。それでも 2026-08-15 / 08-16 の 2 夜連続の
  # 失敗は誰にも気付かれなかった。実測すると通知受信箱には Actions 由来の項目が
  # 1 件も無く、しかも他リポジトリの購読で埋まっていた = **届いても埋没する
  # チャネル**だった。
  #
  # なので issue に落とす。この repo では issue tracker が現役 (#90 / #91)。
  # 重い検査 (--include-ignored / cargo audit / coverage floor / golden query)
  # は全部 nightly にあるので、赤いまま放置されるとその層が丸ごと無効になる。
  # ---------------------------------------------------------------------------
  report:
    name: report nightly status
    needs: [ignored-tests, cargo-audit, coverage]
    # always(): 失敗した時こそ動く必要がある。scheduled 実行と、明示的に
    # 頼まれた手動実行だけに絞り、branch での試し撃ちが issue を作らないようにする。
    if: always() && (github.event_name == 'schedule' || inputs.notify)
    runs-on: ubuntu-latest
    permissions:
      # repo の既定は read (`actions/permissions/workflow` で実測)。ここを
      # 書き忘れると **job は緑のまま issue が作られない** = 通知の仕組み自体が
      # 静かに壊れる、という一番まずい形になる。
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: Nightly is failing
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Find the tracking issue
        id: find
        run: |
          set -euo pipefail
          # タイトル完全一致で引く。ラベルで引かないのは、ラベルが消えたり
          # 名前が変わったりした時に **黙って重複 issue を作り始める** ため。
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
                  --json number,title \
                  --jq '[.[] | select(.title == env.TITLE)] | .[0].number // empty')
          echo "number=$num" >> "$GITHUB_OUTPUT"
          echo "tracking issue: ${num:-none}"

      - name: Report failure
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          ISSUE: ${{ steps.find.outputs.number }}
        run: |
          set -euo pipefail
          # どのジョブが落ちたかは needs.*.result からは名前が取れないので実際の
          # run に聞く。ハードコードした一覧は job を足した時に静かに古くなる。
          jobs=$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs \
                   --jq '.jobs[]
                         | select(.conclusion != "success" and .name != "report nightly status")
                         | "- \(.name): \(.conclusion)"')
          body=$(cat <<BODY
          Nightly failed on \`${GITHUB_SHA:0:8}\` (\`$GITHUB_REF_NAME\`).

          $jobs

          Run: $RUN_URL

          The heavy checks live only here - \`--include-ignored\`, \`cargo audit\`,
          the per-file coverage floor and the golden-query retrieval gate. While
          this is red that whole layer is off, so a green CI on a pull request is
          saying less than it looks like it is.

          This issue closes itself on the next green nightly.
          BODY
          )
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$body"
            echo "commented on #$ISSUE"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body"
          fi

      - name: Close the tracking issue when nightly is green
        if: >-
          !contains(needs.*.result, 'failure') &&
          !contains(needs.*.result, 'cancelled') &&
          steps.find.outputs.number != ''
        env:
          ISSUE: ${{ steps.find.outputs.number }}
        run: |
          set -euo pipefail
          # 直したのに閉じないと、開きっぱなしの issue が「常に赤い」に見えて
          # 無視されるようになる。稀にしか出ないことがこの通知の価値なので、
          # 緑に戻った時に自分で閉じるところまでが仕組みの一部。
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" \
            --comment "Nightly is green again on \`${GITHUB_SHA:0:8}\`: $RUN_URL"
