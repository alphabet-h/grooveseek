name: Nightly

# 毎日 UTC 04:00 (≒ JST 13:00) に走らせる「重めの自動チェック」。
# - cargo test -- --include-ignored: 通常 CI では skip している embedder /
#   reranker 系の実 DL を伴う test (`#[ignore]` 付き、2026-07-26 時点で 40 本)
#   を一通り走らせる。**ubuntu と windows の 2 leg** で回す: Windows 固有の
#   service (Task Scheduler) / tray (.lnk) テストは `#[ignore]` 側にしか無く、
#   Linux だけを回していると永久に検証されないため (AU-09)。
#   モデルは actions/cache で挟むので、2 回目以降は HuggingFace からの再 DL は
#   不要 (BGE-small ~130 MB / BGE-M3 ~2.3 GB / BGE-reranker ~2.3 GB)。
# - cargo audit: 依存ツリーを RustSec advisory DB と突合。新しい advisory
#   が出た時に nightly が fail することで notification として機能する。
#
# workflow_dispatch も付けてあるので、依存 bump 後やリリース前に手動トリガ
# 可能。`gh workflow run nightly.yml` で起動できる。
#
# F-38 (2026-04-29 audit) で導入。eval regression detection は kb-mcp eval
# 側に --fail-on-regression flag を入れる別 PR で追加予定。

on:
  schedule:
    # cron は UTC。'0 4 * * *' = 毎日 UTC 04:00。
    - cron: '0 4 * * *'
  workflow_dispatch: {}

# 同一 ref で同時実行を抑制 (手動 + schedule が重なった場合の保険)。
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  ignored-tests:
    name: ignored tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 片方の OS が落ちても、もう片方の結果は最後まで見たい。
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            # Linux leg は全部走らせる (巨大モデルを要求する 3 本を含む)。
            skip_args: ''
            # resolve_cache_dir() の fallback #2 (dirs::cache_dir()) の実体。
            # なぜこれも cache するかは下の "Cache fastembed models" 参照。
            default_model_dir: ~/.cache/fastembed
          - os: windows-latest
            # Windows leg は「巨大モデルを要求する 3 本」だけ除外する:
            #   - test_bge_m3_produces_1024_dim       (BGE-M3 ~2.3 GB)
            #   - test_bge_reranker_v2_m3_reorders_ja (reranker ~2.3 GB)
            #   - kb_eval_retrieval_quality_bge_m3    (BGE-M3 ~2.3 GB、BU-11)
            # 理由:
            #   (a) windows-latest の空きディスクは公称 14 GB しかなく、
            #       4.6 GB のモデル展開はビルド領域を圧迫する
            #   (b) Actions cache は repo あたり 10 GB 上限の LRU。Linux leg の
            #       model cache だけで ~2.6 GB あり、同じものを Windows 側にも
            #       積むと PR CI 用の cache まで押し出してしまう
            # この 3 本は埋め込み次元・rerank 並び替え・retrieval 品質を見る
            # **OS 非依存** の検査で、Linux leg が同一の assert を通している。
            # ONNX を Windows 上で実行する経路自体は BGE-small を使う他テストが
            # 踏むため、除外しても Windows 固有の死角は生まれない — BU-11 の
            # 品質ゲートも BGE-small 版 (kb_eval_retrieval_quality_bge_small)
            # が両 OS で走る。
            skip_args: '--skip test_bge_m3_produces_1024_dim --skip test_bge_reranker_v2_m3_reorders_ja --skip kb_eval_retrieval_quality_bge_m3'
            default_model_dir: ~/AppData/Local/fastembed
    # 初回は 5 GB 弱の DL があり得るので thoroughly 余裕を持つ。
    timeout-minutes: 60
    env:
      # モデル cache 先を OS 共通の相対パスに固定する。resolve_cache_dir は
      # FASTEMBED_CACHE_DIR を最優先で見る (src/embedder.rs) ので、これで
      # Linux の ~/.cache/fastembed と Windows の %LOCALAPPDATA%\fastembed の
      # 差を吸収でき、actions/cache の `path` を 1 つに保てる。ci.yml が既に
      # 同じ方式を採っている。
      FASTEMBED_CACHE_DIR: ${{ github.workspace }}/.fastembed_cache
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Cargo.lock のハッシュを key に含めると ort/fastembed の major bump 時に
      # cache が自然に invalidate される。
      #
      # `FASTEMBED_CACHE_DIR` が効くので、モデルは基本的に `.fastembed_cache` に
      # 落ちる。OS 既定ディレクトリも併せて cache するのは保険:
      # `resolve_cache_dir()` は env が無ければ `dirs::cache_dir()` に落ちるため、
      # env を継承しない経路が 1 つでもあると、そこだけ cache 対象外になる。
      #   - `.fastembed_cache`     … env が効いている全プロセス
      #   - `<default_model_dir>`  … env を見ずに解決した場合の落ち先
      # かつて lib test が `remove_var("FASTEMBED_CACHE_DIR")` でプロセス全体の
      # env を消しており、実際に BGE-M3 / reranker がここへ逸れていた。その
      # 根本原因は AU-63 で解消済みだが、同種の再発を黙って劣化させないために
      # 両方を cache し続ける (片方だけだと job は green のまま毎晩 4.6 GB を
      # 再 DL する。2026-07-26 に Linux cache が 2.6 GB → 74 MB に縮んで発覚)。
      #
      # key の版数は **path・中身の構成・モデルの落ち先が変わったら必ず上げる**:
      # (a) 旧 `fastembed-<os>-<hash>` の tar は `~/.cache/fastembed` を絶対
      #     パスで抱えており、`path` だけ変えて同じ key を再利用すると
      #     「cache hit したのに参照先には何も無い」状態が永続する
      # (b) `actions/cache` は **既存 key を上書き保存しない**。実機ログでも
      #     `Cache hit occurred on the primary key ..., not saving cache.` と
      #     出る。したがって key を据え置くと、古い配置の archive が
      #     Cargo.lock が変わるまで凍結される
      # `-v4-` は (b) が理由: AU-63 で env が消えなくなり、モデルの落ち先が
      # `.fastembed_cache` に一本化されたので、v3 の archive (= 大物が
      # `<default_model_dir>` 側に入っている) を作り直す必要がある。
      - name: Cache fastembed models
        uses: actions/cache@v5
        with:
          path: |
            .fastembed_cache
            ${{ matrix.default_model_dir }}
          key: fastembed-v4-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            fastembed-v4-${{ runner.os }}-

      # cold cache のとき、複数の integration test binary が **別プロセス** と
      # して同時に kb-mcp を spawn し、HuggingFace hub の同一 blob lock を
      # 奪い合って "Lock acquisition failed" で落ちる。ci.yml には PR #71 で
      # 同じ pre-warm が入ったが nightly には無く、model cache が 10 GB LRU で
      # 追い出された夜に顕在化する (2026-07-26 の dry-run で ubuntu / windows
      # 双方とも再現)。1 プロセスだけに DL させてから本体を warm cache で回す。
      #
      # BGE-M3 / reranker は lib test binary の中 (= 単一プロセス、別 blob) から
      # しか触られないので、ここで温めるのは BGE-small だけでよい。
      #
      # retry する理由: 上流 (HuggingFace CDN) の一時障害で nightly が赤くなるのを
      # 防ぐため。2026-07-26 の実測では cold cache の run を短時間に繰り返したところ
      # model.onnx の取得が 503 を返した (run 30190347439)。厄介なのは、失敗すると
      # 罠 3 (= cache は job 成功時のみ保存) により翌日も cold のままで、
      # **自然回復しない**こと。
      #
      # 本 step の目的は cache を温めることで、その合否は品質シグナルではない
      # (本体スイートは後段で別に走る)。したがってここでの retry は flaky test の
      # 隠蔽にはあたらない。
      - name: Pre-warm embedding model cache (serial)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if cargo test --test index_progress_cli -- --test-threads=1; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              backoff=$((attempt * 60))
              echo "::warning::pre-warm attempt ${attempt} failed; retrying in ${backoff}s" >&2
              sleep "${backoff}"
            fi
          done
          echo "::error::pre-warm failed after 3 attempts" >&2
          exit 1

      - name: cargo test -- --include-ignored
        # `--include-ignored` は ignored + 通常両方を走らせる。nightly では
        # 通常の `cargo test` も合わせて走らせて、ignored だけ落ちる
        # (model DL だけ壊れている) ケースを切り分けやすくする。
        #
        # `--features test-helpers` はここでしか効かない。gate の向こうにある
        # admin endpoint テスト 2 本は `#[ignore]` でもあるので、PR CI が
        # feature 付きで compile しても**走らない** — 実行まで届くのは
        # `--include-ignored` を渡すこの job だけ。
        run: cargo test --features test-helpers -- --include-ignored ${{ matrix.skip_args }}

  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      # advisory にぶつかれば exit 1 で job fail = notification として機能する。
      # 既知 advisory を一時的に許容したい場合は --ignore RUSTSEC-... を渡す。
      - name: cargo audit
        run: cargo audit

  coverage:
    name: line coverage (cargo-llvm-cov)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8

      # 本 job は cache も pre-warm も持たず、毎回 cold から複数 test binary が
      # 並列にモデルを DL していたため、ignored-tests job と同じ blob lock 競合で
      # 断続的に落ちていた (2026-07-26 の dry-run run 30190003925 で再現)。
      #
      # **restore 専用** にしてあるのが要点: save も行うと ignored-tests job と
      # 同じ key を奪い合い、先に終わった本 job (BGE-small だけ ≒ 74 MB) が
      # key を取ってしまうと、ignored-tests 側の 2.7 GB は
      # 「既存 key は上書きしない」規則で永久に保存されなくなる。
      # 本 job は非 ignored テストしか走らせず BGE-small しか要らないので、
      # ignored-tests job が保存した cache に相乗りするだけでよい。
      - name: Restore fastembed models (shared with ignored-tests)
        uses: actions/cache/restore@v5
        with:
          path: |
            .fastembed_cache
            ~/.cache/fastembed
          key: fastembed-v4-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            fastembed-v4-${{ runner.os }}-

      # cache miss の日でも lock 競合で落ちないよう、1 プロセスで先に温める。
      # retry の理由は ignored-tests job 側の同名 step のコメントを参照。
      - name: Pre-warm embedding model cache (serial)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if cargo test --test index_progress_cli -- --test-threads=1; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              backoff=$((attempt * 60))
              echo "::warning::pre-warm attempt ${attempt} failed; retrying in ${backoff}s" >&2
              sleep "${backoff}"
            fi
          done
          echo "::error::pre-warm failed after 3 attempts" >&2
          exit 1

      # `cargo test` の non-ignored セット (= unit + integration test、
      # `#[ignore]` 除外) で coverage を取る (~5-10 min)。
      # `--include-ignored` (model DL ~5 GB) は別 job (= ignored-tests)
      # で実行済なので、本 job は coverage 数値の baseline 観測が目的。
      # `--summary-only` で per-region detail を抑制し、file 単位 summary
      # table + TOTAL 行のみ出力 (= F-59 「死角を定量化」要件)。
      # `--color never` で ANSI escape を抑制し GITHUB_STEP_SUMMARY の
      # code block 整合性を保つ。
      - name: Run coverage (non-ignored only)
        run: cargo llvm-cov --summary-only --color never > coverage_summary.txt

      - name: Append summary to GITHUB_STEP_SUMMARY
        run: |
          {
            echo "## Line coverage (cargo-llvm-cov, non-ignored tests)"
            echo ""
            echo '```'
            cat coverage_summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 通常 log (= workflow run の Raw logs / `gh run view --log`
          # で参照可) にも summary を直接出力。HEREDOC 内の `cat` は
          # GITHUB_STEP_SUMMARY への redirection 専用なので stdout に
          # 何も出ない、ここで bare `cat` により通常 log でも summary を
          # grep 可能にする。
          cat coverage_summary.txt
