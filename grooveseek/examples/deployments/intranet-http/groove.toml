# Intranet HTTP server deployment — groove.toml (server side)
#
# Place this at /srv/groove/groove.toml so the systemd unit's
# `WorkingDirectory=/srv/groove` setting causes CWD discovery to pick it up.
# See README.md / README.ja.md for the full setup.

# Absolute path to the knowledge base directory on the server.
# .groove.db will land at /srv/groove/.groove.db (parent of kb_path).
kb_path = "/srv/groove/knowledge-base"

# Multilingual model is the safer default for shared KBs.
model = "bge-m3"

# Reranker loaded but off by default; clients opt in per-query.
reranker = "bge-v2-m3"
rerank_by_default = false

# ONNX model cache. Create this directory before first run:
#   sudo install -d -o groove -g groove /var/cache/fastembed
# (the systemd unit only `ReadWritePaths=` it; it does not create or chown.)
fastembed_cache_dir = "/var/cache/fastembed"

[parsers]
enabled = ["md"]

# Watcher ON — the server is the single writer, and inotify on local disk is reliable.
# 500 ms debounce coalesces fast-edit bursts. Bump if `git pull` events spam.
[watch]
enabled = true
debounce_ms = 500

[quality_filter]
enabled = true
threshold = 0.3

# HTTP transport. Bind to a LAN-reachable address ONLY if you trust everyone
# on that network — groove has no authentication. For real deployments,
# bind to 127.0.0.1:3100 and put nginx/Caddy in front for TLS + auth.
[transport]
kind = "http"

[transport.http]
# Loopback default (recommended). Change to 0.0.0.0:3100 for direct LAN access
# without a proxy, or to the LAN-internal IP (e.g. 192.168.1.10:3100) to
# expose only on a specific interface.
bind = "127.0.0.1:3100"

# Host header allow-list (DNS-rebinding defence). Omitted, it defaults to
# loopback only — ["localhost", "127.0.0.1", "::1"] — which means every LAN
# client is answered with 403, because their Host header carries the server's
# name or IP. Changing `bind` alone is NOT enough: list here every hostname
# and address clients actually put in their URL, matching the `.mcp.json` in
# this directory. groove warns at startup when it binds off-loopback while
# this key is still absent.
#
# Uncomment together with a LAN `bind`:
# allowed_hosts = ["kb-server.lan", "192.168.1.10"]
#
# Behind a reverse proxy, list the name clients use to reach the proxy (the
# proxy must forward it, e.g. nginx `proxy_set_header Host $host;`).
# An empty list disables the check entirely — do not do that on a network you
# do not fully trust.
