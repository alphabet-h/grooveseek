[package]
name = "grooveseek"
version = "1.2.0"
edition = "2024"
description = "Semantic hybrid search (sqlite-vec + FTS5 with optional cross-encoder reranking) over a local knowledge base of Markdown, plain-text, PDF and Office documents, served over MCP or a web UI."
authors = ["koshian"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/alphabet-h/grooveseek"
homepage = "https://github.com/alphabet-h/grooveseek"
# README は repo root に残してある (= GitHub の repo home で表示される)。
# workspace 化 (feature-44 PR-1) でこの Cargo.toml は grooveseek/ に動いたので、
# crates.io publish / cargo package validation が見れるよう relative path で
# 上 1 階層を指す (= codex P2 round 2 on PR #61)。
readme = "../README.md"
keywords = ["mcp", "rag", "search", "embedding", "sqlite-vec"]
categories = ["command-line-utilities", "database", "text-processing"]
# The Rust API is not part of the 1.0 promise (docs/stability.md, ADR-0008). The
# public items exist because the binary and its tests are built from them, not
# because they are offered for reuse — and `cargo package` cannot succeed anyway
# while the workspace uses unversioned path dependencies. Marking it rather than
# only documenting it means `cargo publish` refuses, so the exclusion cannot be
# undone by accident. Remove this line only as part of deciding to publish.
publish = false

# (cargo-dist 罠 4) A `publish = false` package is skipped by dist unless it says
# `dist = true` — `targets` alone does nothing. Omitting this would drop the main
# binary from every release while CI stayed green, which is exactly how the tray
# and svc binaries went unshipped for eight releases.
[package.metadata.dist]
dist = true

# The package is `grooveseek` (that is the crates.io identity) but the command
# is `groove`, so the name a user types matches the on-disk identifiers —
# `groove.toml`, `.groove.db`, `.grooveignore`. Without this section Cargo would
# derive the binary name from the package name. `path` is explicit because
# declaring `[[bin]]` turns off autodiscovery of `src/main.rs`.
[[bin]]
name = "groove"
path = "src/main.rs"

# rustdoc lint levels come from the workspace root, where the reasoning lives.
[lints]
workspace = true

[dependencies]
rmcp = { version = "3", features = ["server", "transport-io", "transport-streamable-http-server", "macros"] }
tokio = { workspace = true, features = ["full"] }
axum = "0.8"
# AU-17 codex P1: `search` の filter 上限は rmcp が body を全部 buffer して
# `SearchParams` に deserialize した **後** にしか効かない。body 自体を
# 包んで上限をかけられる layer が要る (axum の `DefaultBodyLimit` は
# extractor 側の協力が前提で、nest した rmcp service には効かない)。
# axum 0.8 の transitive で既に tree にある (v0.6.8)。
tower-http = { version = "0.6", features = ["limit"] }
# [D-11 / feature-39] /healthz Host validation を `http::uri::Authority::try_from`
# 委譲に refactor するため direct dep 宣言。axum 0.8 transitive で既に v1.4.0 が
# 入っているので追加コストなし。
http = "1"
fastembed = "5"
rusqlite = { version = "0.39", features = ["bundled"] }
sqlite-vec = "0.1"
pulldown-cmark = "0.13"
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_bw = "2"
toml = { workspace = true }
# [v0.9.2 hot-fix] Preserve comments / field ordering / formatting when
# `groove service install --force` re-runs over an existing groove.toml.
# `toml` (= serde-based) drops comments on round-trip, which destroys
# user-customized configs (= regression discovered during feature-44 dogfood).
# `toml_edit` keeps the original document layout while letting us overwrite
# only the CLI-managed fields (kb_path / [transport.http].bind).
toml_edit = "0.25"
clap = { workspace = true }
sha2 = "0.10"
chrono = "0.4"
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
walkdir = "2"
dirs = { workspace = true }
# [feature 17] frontmatter スキーマ検証の pattern フィールド用
regex = "1"
# [feature 12] file watcher + debouncer。rename を from/to ペアとして拾える
# notify-debouncer-full を採用。notify 本体は transitive で取り込まれる。
notify = "8"
notify-debouncer-full = "0.6"
# [feature 26] path_globs filter 用
globset = "0.4"
# [feature-49 / C-7] `.grooveignore`。gitignore 構文のマッチャとしてのみ使い、
# `WalkBuilder` には乗り換えない (理由は src/exclusion.rs の module doc と
# docs/decisions/0003-*.md)。依存 11 crate はすべて既に lock 済みで、
# 純増はこの 1 crate。
ignore = "0.4"
# [feature 27] config discovery: cross-platform `~` 展開
shellexpand = "3"
# [feature-31] f32x8 SIMD kernel for mmr::cosine_similarity (pure-rust, ~50 KB)。
# `From<[f32; 8]>` のみ実装、`From<&[f32]>` は無いので [f32; 8] buffer 経由で構築する。
wide = "0.7"
# [feature-42 / D-10] Progress bar for `groove index --progress` (TTY) +
# IsTerminal-aware fallback for non-TTY (pipe / harness). MSRV 1.70 per cargo info.
indicatif = "0.18"
# [feature-45 PR-2] PDF text extraction. exact pin — 単独 maintainer の API 激変
# 対策 (spec §3 #2)。dry-run で pdf-extract の panic / レイアウト崩壊 / 低速を回避
# するため採用。純 Rust・MIT。詳細: .dev/knowledge/feature-45-pdf-crate-dryrun.md。
# metadata() が Title/CreationDate を返すため lopdf 直接依存は不要。
# 4.3.0 (AU-70): /DescendantFonts の 4 綴り対応 (upstream #469/#470 = 当方報告・実装)
# を含む版。予約 CMap + /ToUnicode 無しの日本語 CID PDF が正しく抽出できる。
oxidize-pdf = "=4.3.0"
# [feature-45 PR-3] Office 抽出。calamine=xlsx/xls (streaming, 純 Rust)。
# zip/quick-xml は calamine が transitive で導入済のため direct dep に昇格
# (docx/pptx を自前実装するのに使う。XML スタックを 1 本化して追加 heavy dep ゼロ)。
calamine = "0.36"
zip = "8"
quick-xml = "0.41"

# (feature-56) Source code parsed into one chunk per definition. `tree-sitter` is
# the runtime, `tree-sitter-tags` turns a parse tree into definitions and
# references using the grammar's own `tags.scm`, and `tree-sitter-language` is
# the thin crate a grammar hands its parse table over through.
#
# The Rust grammar is compiled in behind `grammar-rust` (on by default, measured
# at just over a megabyte); other languages arrive as separate libraries the user
# places, which is ADR-0013.
tree-sitter = "0.26"
tree-sitter-tags = "0.26"
tree-sitter-language = { workspace = true }
tree-sitter-rust = { version = "0.24", optional = true }
groove-grammar-abi = { path = "../crates/groove-grammar-abi" }
# (feature-56 PR-3a) `dlopen` for grammars that arrive as separate libraries.
#
# Unconditional rather than behind a feature: the loader is what makes an id
# resolvable at all, so a build without it could only ever answer "unknown id"
# for every language that is not compiled in — the diagnostic this feature
# exists to replace. The crate is a thin wrapper over the platform call: its
# only dependencies are `cfg-if` and `windows-link`, and both were already in
# the lock before this edge existed.
#
# The Windows path needs `os::windows::Library::load_with_flags`, which is why
# the OS-specific half of the API is used rather than the portable `Library::new`:
# the flags decide which directories the loader searches for the plugin's own
# dependencies, and the default search order includes the current directory.
libloading = "0.9"

# (feature-44 PR-3) Windows-only path dep on the tray crate so
# `groove service install --with-tray` can call into the tray's
# shell:startup shortcut installer. Library API only — the
# `groove-tray.exe` binary is shipped separately via cargo-dist.
# (BU-20) `O_NOFOLLOW` / `O_NONBLOCK` for the read-time open in `src/links.rs`,
# and `ELOOP` to tell a refused symlink from a real I/O failure. The constants
# differ per target OS, which is exactly what this crate exists to get right —
# hard-coding them would be the kind of "works on Linux" guess this repo avoids.
# Already in the dependency tree (rusqlite's bundled SQLite pulls it in), so this
# adds no build. Windows is guarded differently and needs none of it; see the
# module docs for why.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
groove-tray = { path = "../crates/groove-tray" }
# (BU-20) `GetFileInformationByHandle` for the hard-link count. The stable
# alternative does not exist: `MetadataExt::number_of_links` is still unstable,
# and walkdir's metadata comes from `WIN32_FIND_DATAW`, which carries no link
# count at all. Already in the dependency tree at this version (via the tray and
# several transitive deps), so this adds no new build.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[features]
# (feature-56) The Rust grammar, compiled in. On by default: it is the language
# groove is written in, and the increment was measured at just over a megabyte,
# small enough to carry whether or not a given user indexes code.
#
# Turning it off is supported and checked in CI (`cargo check
# --no-default-features -p grooveseek`), which is what keeps the id-resolution
# path honest about a build that knows `rs` but cannot parse it. Tests run with
# default features, so the message for that state is pinned through a pure
# function rather than through a feature-off test binary.
default = ["grammar-rust"]
grammar-rust = ["dep:tree-sitter-rust"]
# Reranker (~2.3 GB) を要求する bench を default 起動から除外する gate。
# `cargo bench --features heavy-bench --bench search_latency` で reranker bench fn が
# compile + 実行される (criterion 0.5 には #[ignore] 機構がないため Cargo feature で gate)。
heavy-bench = []
# (feature-43 PR-2) `KbServerShared::for_test` などの test-only constructor を
# integration test crate (= tests/*.rs) から参照可能にする gate。
# `#[cfg(test)]` は lib 内 test にしか効かないため、tests/ 配下から触りたい
# helper は feature flag を立てる必要がある。default off (production には載らない)。
test-helpers = []

[dev-dependencies]
# Property-based testing for f64 invariant guards (recall_at_k / ndcg_at_k /
# chunk_quality_score の値域 [0.0, 1.0] を proptest で固定)。
proptest = "1"
# F-64 (feature-38): /healthz middleware の unit test (= ServiceExt::oneshot
# で Router を 1 リクエスト処理) 用。axum 0.8 の transitive 経由で workspace
# に存在するが、direct dep 宣言なしで `use tower::...` するのは resolver = "2"
# 配下で warning / 不安定なので direct dep 宣言する。
tower = { version = "0.5", features = ["util"] }
# [F-39 PR-B] criterion-based benchmarking infrastructure. The benches under
# `benches/` call into the lib crate (and subprocess where needed), since the
# lib surface is intentionally unstable (see src/lib.rs).
# `default-features = false` skips the `rayon`-driven HTML report machinery,
# trading ~30s of compile time per first build for (no HTML; we already use
# the JSON output for trend tracking).
criterion = { version = "0.5", default-features = false }
# (BU-03) `Connection::trace` — lets a test count the SQL statements a search
# actually executes, instead of counting calls to the Rust method that issues
# them. The feature is declared **only here**, so a plain `cargo build` links
# rusqlite without it and the shipped binary is unaffected; Cargo unifies the
# feature into the same rusqlite when it builds the test targets.
rusqlite = { version = "0.39", features = ["trace"] }
# `tests/docs_links_resolve.rs` のみが使う。GitHub は Markdown のリンク先を
# percent-decode してから解決するので (`docs/my%20guide.md` → `docs/my guide.md`)、
# 同じ decode を挟まないと「読者が辿れるリンク」で CI が落ちる。`url` の transitive
# 経由で既に lock に居るが、テストから直接 `use` する以上は direct dep 宣言する
# (tower と同じ理由)。
percent-encoding = "2"

# Each `[[bench]]` entry below MUST set `harness = false` because criterion
# brings its own harness. `name` matches the file under `benches/`.
[[bench]]
name = "string_ops"
harness = false

# F-60 PR-1: MMR microbench (lib.rs 経由で grooveseek::mmr::mmr_select を直接叩く)
[[bench]]
name = "mmr_perf"
harness = false

# F-60 PR-1: search latency subprocess bench. reranker bench は heavy-bench feature gate
[[bench]]
name = "search_latency"
harness = false

# F-60 PR-2 (Cycle C / feature-37): chunker / chunker+embedder throughput.
# chunker only fn = default。chunker+embedder fn = heavy-bench feature gate (model DL ~130 MB)。
[[bench]]
name = "index_throughput"
harness = false

# (feature-56 PR-3a) Grammar plugin fixtures for `tests/grammar_plugin_cli.rs`.
#
# `[[example]]` with `crate-type = ["cdylib"]` because that is the shape a real grammar plugin
# has, and because `cargo test` builds it: measured, `cargo test --no-run` leaves
# `target/<profile>/examples/<name>.<dll suffix>` in place, so the test finds the file rather
# than shelling out to cargo to make one. Building from a test would take the same build lock
# the test is already running under.
#
# `path` is explicit and points **outside** `examples/`: that directory is the user-facing
# recipe collection the docs link to, and the docs corpus guards walk it.
#
# Declaring any `[[example]]` turns off example autodiscovery for this package. Nothing is lost
# today (`examples/` holds no `.rs`), but a `.rs` dropped in there later will not be built
# unless it is named here too.
[[example]]
name = "groove_grammar_python"
path = "tests/fixtures/grammar_plugins/valid.rs"
crate-type = ["cdylib"]

[[example]]
name = "groove_grammar_no_symbols"
path = "tests/fixtures/grammar_plugins/no_symbols.rs"
crate-type = ["cdylib"]

[[example]]
name = "groove_grammar_claims_rs"
path = "tests/fixtures/grammar_plugins/claims_rs.rs"
crate-type = ["cdylib"]

# The two below are hand-written rather than built by `groove_grammar_plugin!`: the macro
# cannot express a NULL export. Like every hand-written fixture here they need no
# `grammar-rust`, because the loader refuses them before it ever asks for a parse table -- one
# carrying a real table would need a grammar crate to test something that has nothing to do
# with one.
[[example]]
name = "groove_grammar_null_language"
path = "tests/fixtures/grammar_plugins/null_language.rs"
crate-type = ["cdylib"]

[[example]]
name = "groove_grammar_null_tags"
path = "tests/fixtures/grammar_plugins/null_tags.rs"
crate-type = ["cdylib"]

# Needs `grammar-rust`, unlike the two above: it has to hand over a *real* parse table the
# first time before it starts answering NULL, and a fixture with no real table to hand over
# would be `null_language.rs` rather than this one.
[[example]]
name = "groove_grammar_flaky_language"
path = "tests/fixtures/grammar_plugins/flaky_language.rs"
crate-type = ["cdylib"]


# (AV-09) The rest of the fixtures, in three families. What separates them is not taste: a
# fixture is hand-written when the shape it needs is one `groove_grammar_plugin!` cannot say,
# and it needs `grammar-rust` when the check it is about sits past the parse table.
#
# **Hand-written, and refused before a parse table is asked for**, so none of these needs
# `grammar-rust`. Each says something the macro cannot: a version other than the one the macro
# was compiled against, a missing export, a NULL, a length that does not describe its pointer,
# or bytes that are not UTF-8.
[[example]]
name = "groove_grammar_wrong_abi"
path = "tests/fixtures/grammar_plugins/wrong_abi.rs"
crate-type = ["cdylib"]

# The five below are one ladder: each omits exactly one export, in the order
# `groove_grammar_abi::symbols` lists them, which is the order the ABI says the loader looks
# them up in. `no_symbols.rs` above covers the first rung by omitting all six.
[[example]]
name = "groove_grammar_without_language"
path = "tests/fixtures/grammar_plugins/without_language.rs"
crate-type = ["cdylib"]

[[example]]
name = "groove_grammar_without_name"
path = "tests/fixtures/grammar_plugins/without_name.rs"
crate-type = ["cdylib"]

[[example]]
name = "groove_grammar_without_extensions"
path = "tests/fixtures/grammar_plugins/without_extensions.rs"
crate-type = ["cdylib"]

[[example]]
name = "groove_grammar_without_tags_query"
path = "tests/fixtures/grammar_plugins/without_tags_query.rs"
crate-type = ["cdylib"]

[[example]]
name = "groove_grammar_without_build_info"
path = "tests/fixtures/grammar_plugins/without_build_info.rs"
crate-type = ["cdylib"]

[[example]]
name = "groove_grammar_huge_tags_query"
path = "tests/fixtures/grammar_plugins/huge_tags_query.rs"
crate-type = ["cdylib"]

[[example]]
name = "groove_grammar_not_utf8_tags_query"
path = "tests/fixtures/grammar_plugins/not_utf8_tags_query.rs"
crate-type = ["cdylib"]

[[example]]
name = "groove_grammar_null_name"
path = "tests/fixtures/grammar_plugins/null_name.rs"
crate-type = ["cdylib"]

[[example]]
name = "groove_grammar_not_utf8_name"
path = "tests/fixtures/grammar_plugins/not_utf8_name.rs"
crate-type = ["cdylib"]

# **Hand-written, and carrying a parse table of their own making.** The one check that happens
# *at* the table rather than before or after it -- is its Tree-sitter ABI one this build speaks
# -- can be reached from neither of the other two families: the macro only ever hands over a
# table a real grammar crate supplies, and a fixture with no table at all is refused a few lines
# earlier. So these two forge one, which needs no grammar crate. They sit here, between the
# families, because that is where the check they are about sits in the loader.
[[example]]
name = "groove_grammar_stale_tree_sitter"
path = "tests/fixtures/grammar_plugins/stale_tree_sitter.rs"
crate-type = ["cdylib"]

[[example]]
name = "groove_grammar_future_tree_sitter"
path = "tests/fixtures/grammar_plugins/future_tree_sitter.rs"
crate-type = ["cdylib"]


# **Built by `groove_grammar_plugin!`, and all of them need `grammar-rust`.** These are refused
# for a string they declare, and every one of those checks sits *after* the parse table has been
# accepted -- so unlike the family above, each has to hand over a real grammar to reach the line
# it is about. The macro validates nothing at compile time, which is what lets a broken
# declaration be written without hand-writing six exports.
[[example]]
name = "groove_grammar_two_extensions"
path = "tests/fixtures/grammar_plugins/two_extensions.rs"
crate-type = ["cdylib"]

[[example]]
name = "groove_grammar_bad_extension"
path = "tests/fixtures/grammar_plugins/bad_extension.rs"
crate-type = ["cdylib"]

[[example]]
name = "groove_grammar_bad_name"
path = "tests/fixtures/grammar_plugins/bad_name.rs"
crate-type = ["cdylib"]

[[example]]
name = "groove_grammar_uncompilable_tags_query"
path = "tests/fixtures/grammar_plugins/uncompilable_tags_query.rs"
crate-type = ["cdylib"]
