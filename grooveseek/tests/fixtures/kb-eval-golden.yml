# Golden query set for the `kb-eval` fixture corpus (BU-11).
#
# Two groups, and the difference between them is what each one can measure.
#
# **Single-answer queries** name exactly one document, and every file in
# `tests/fixtures/kb-eval/` is named by at least one of them — so a document
# that stops being findable shows up as a drop in recall@1 / MRR rather than
# being averaged away. These carry the retrieval-quality gate.
#
# **Multi-answer queries** name two, and exist because recall@1 cannot say
# anything about them: with two right answers the best possible recall@1 is
# 0.5, so a system that returns one of the two and a system that returns both
# score the same. What separates those two systems is recall@5, which on
# single-answer queries is nearly always 1.0 and therefore says nothing. The
# two groups are averaged separately in `tests/eval_corpus_quality.rs` for that
# reason: mixing them would move the headline number without measuring
# anything new.
#
# The queries are deliberately *paraphrases*: they avoid the document's own
# headings and, where practical, its distinctive nouns ("カナリア", "postmortem",
# "rate limit"). A golden built from verbatim substrings would stay green even
# if the semantic leg of the hybrid search died completely.
#
# Consumed by `tests/eval_corpus_quality.rs` via `groove eval --golden`. It is
# NOT copied into the indexed corpus, so adding a query never changes the
# document set being measured.

queries:
  # --- ops/ -----------------------------------------------------------------
  # Distractor pair: rollback vs canary. Both describe releasing to production
  # and both mention 切り戻し, so a rank-1 hit here means the two were told
  # apart rather than merely both retrieved.
  - id: ja-rollback
    query: "本番に出した変更を前のバージョンへ戻したい"
    expected:
      - path: "ops/deploy-rollback.ja.md"
  - id: ja-canary
    query: "新しいビルドを一部の利用者にだけ先に届けて様子を見るやり方"
    expected:
      - path: "ops/deploy-canary.ja.md"
  - id: ja-oncall
    query: "深夜に障害が起きたとき誰にどうやって連絡すればよいか"
    expected:
      - path: "ops/oncall-escalation.ja.md"
  - id: ja-cost
    query: "クラウドの請求額が急に増えた原因の調べ方"
    expected:
      - path: "ops/cost-monitoring.ja.md"
  - id: en-postmortem
    query: "how soon after an incident do we have to write the review"
    expected:
      - path: "ops/incident-postmortem.md"
  # Distractor pair: backup retention vs point-in-time recovery. Both talk
  # about snapshots and log segments.
  - id: en-backup-retention
    query: "how long do we hold on to the nightly database copies"
    expected:
      - path: "ops/database-backup.md"
  - id: en-restore-pitr
    query: "bring the database back to the state it was in before a bad write"
    expected:
      - path: "ops/database-restore.md"

  # --- guide/ ---------------------------------------------------------------
  - id: ja-onboarding
    query: "入ったばかりの人が最初の一週間で何をすればよいか"
    expected:
      - path: "guide/onboarding.ja.md"
  - id: ja-review
    query: "レビューを頼まれたとき最初に何を確認すればよいか"
    expected:
      - path: "guide/code-review.ja.md"
  - id: ja-writing
    query: "読み手が迷わない手順書の組み立て方"
    expected:
      - path: "guide/writing-docs.ja.md"
  - id: en-branch-naming
    query: "what should I call the branch for a bug fix"
    expected:
      - path: "guide/branching.md"
  - id: en-test-balance
    query: "how many browser driven checks should one service have"
    expected:
      - path: "guide/testing-strategy.md"
  - id: en-local-stack
    query: "getting the whole system up and running on my own laptop"
    expected:
      - path: "guide/local-setup.md"
  - id: en-flag-cleanup
    query: "when is it safe to remove a toggle from the code"
    expected:
      - path: "guide/feature-flags.md"

  # --- ref/ -----------------------------------------------------------------
  # Distractor pair: both documents are about authentication and both mention
  # secrets, tokens and expiry.
  - id: en-oauth-code
    query: "trading the short lived code from the redirect for an access token"
    expected:
      - path: "ref/auth-oauth.md"
  - id: en-key-rotation
    query: "swap a service credential for a new one without an outage"
    expected:
      - path: "ref/auth-api-keys.md"
  - id: en-429
    query: "callers are getting 429 responses, how should the client behave"
    expected:
      - path: "ref/rate-limiting.md"
  - id: en-log-fields
    query: "which fields does every log line have to carry"
    expected:
      - path: "ref/logging-format.md"
  - id: ja-cache
    query: "更新したのに古い内容が表示され続ける"
    expected:
      - path: "ref/cache-invalidation.ja.md"
  - id: ja-error-code
    query: "応答に入っている四桁の識別子の意味を調べたい"
    expected:
      - path: "ref/error-codes.ja.md"

  # --- lexical group --------------------------------------------------------
  # Queries whose answer is an exact token — an error number, a header name, a
  # path, a literal prefix, a clock time. These exist to keep the FTS leg
  # honest. Measured 2026-08-14 on this corpus: with the FTS leg forced silent,
  # the twenty paraphrase queries above lose nothing at all under BGE-M3
  # (1.00 → 1.00), because twenty semantically distinct documents are separable
  # by the vector leg alone. The five below are what turns "the keyword half of
  # the hybrid search died" into a failing assertion instead of a green run.
  - id: lex-error-3007
    query: "3007 が返ってきた"
    expected:
      - path: "ref/error-codes.ja.md"
  - id: lex-retry-after
    query: "Retry-After header"
    expected:
      - path: "ref/rate-limiting.md"
  - id: lex-bootstrap
    query: "scripts/bootstrap"
    expected:
      - path: "guide/local-setup.md"
  - id: lex-chore-prefix
    query: "chore prefix"
    expected:
      - path: "guide/branching.md"
  - id: lex-snapshot-time
    query: "02:00 UTC"
    expected:
      - path: "ops/database-backup.md"

  # --- multi-answer group ---------------------------------------------------
  # Queries with two right answers, one per distractor pair. The pairs are the
  # ones the corpus was built with and the ones commented above: each is two
  # documents on one subject, close enough that a single-answer query has to
  # tell them apart. A multi-answer query asks the other question — whether
  # both come back when both are right — and that is the one the single-answer
  # group cannot ask.
  #
  # Deliberately built on existing documents. Adding a document would change
  # the candidate set every other query is scored against; adding a query
  # cannot, because the golden is never copied into the corpus.
  #
  # Each query is written to the subject the pair shares rather than to either
  # side of it, so neither document is the better answer.
  - id: multi-ja-release-safety
    query: "新しい版を本番に届けるとき利用者への影響を小さく抑える進め方"
    expected:
      - path: "ops/deploy-canary.ja.md"
      - path: "ops/deploy-rollback.ja.md"
  - id: multi-en-database-recovery
    query: "the arrangements that let a database be returned to an earlier moment after bad data lands"
    expected:
      - path: "ops/database-backup.md"
      - path: "ops/database-restore.md"
  - id: multi-en-credential-expiry
    query: "a secret used to authenticate does not last forever, so how does a fresh one get into place before the old one dies"
    expected:
      - path: "ref/auth-api-keys.md"
      - path: "ref/auth-oauth.md"
  - id: multi-ja-act-before-you-know
    query: "取り返しがつかなくなる前に、調べ終わるのを待たずに手を打ってよい場面"
    expected:
      - path: "ops/deploy-rollback.ja.md"
      - path: "ops/oncall-escalation.ja.md"
  - id: multi-en-incident-record
    query: "an incident review is built out of what the services logged, so what has to be in those records"
    expected:
      - path: "ops/incident-postmortem.md"
      - path: "ref/logging-format.md"
